<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132238" />
    <meta name="description" content="Ingenium — estudo focado de Matemática e Física para o exame de acesso à Engenharia na Universidade Metodista." />
    <title>Ingenium · Matemática + Física</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Mono:wght@400;500&family=Kalam:wght@300;400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Ingenium, início">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28" width="26" height="26"><path d="M14 4.5 25 23H3Z" fill="none" stroke="#132238" stroke-width="2.4" stroke-linejoin="round"/><path d="M8.7 15.6h10.6" stroke="#132238" stroke-width="2.2" stroke-linecap="round"/></svg></span>
          <strong>INGENIUM</strong>
        </a>
        <div class="topbar-actions">
          <button class="icon-button" id="reset-progress" title="Recomeçar progresso" aria-label="Recomeçar progresso">↺</button>
          <div class="avatar" aria-label="Perfil">RB</div>
        </div>
      </header>

      <main id="app" tabindex="-1">
        <section class="view" data-view="home"></section>
        <section class="view hidden" data-view="path"></section>
        <section class="view hidden" data-view="lesson"></section>
        <section class="view hidden" data-view="triangles"></section>
        <section class="view hidden" data-view="test"></section>
        <section class="view hidden" data-view="profile"></section>
      </main>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <a href="#home" data-nav="home"><span class="nav-icon">⌂</span><span>Início</span></a>
        <a href="#path" data-nav="path"><span class="nav-icon">✦</span><span>Rota</span></a>
        <a href="#triangles" data-nav="triangles"><span class="nav-icon">△</span><span>Triângulos</span></a>
        <a href="#test" data-nav="test"><span class="nav-icon">▣</span><span>Mini-teste</span></a>
        <a href="#profile" data-nav="profile"><span class="nav-icon">○</span><span>Perfil</span></a>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
